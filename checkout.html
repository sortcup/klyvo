<body>
  <header id="site-header"></header>
  <main>
    <section class="page-header"><div class="container"><nav aria-label="Fil d’Ariane"><ol class="breadcrumb mb-2"><li class="breadcrumb-item"><a href="index.html">Accueil</a></li><li class="breadcrumb-item"><a href="cart.html">Panier</a></li><li class="breadcrumb-item active">Commande</li></ol></nav><h1 class="mb-1">Finaliser la commande</h1><p class="mb-0 text-secondary">Vos prix et le stock seront revérifiés avant confirmation.</p></div></section>
    <section class="section-space pt-4"><div class="container" id="checkout-root"><div class="row g-4"><div class="col-lg-8">
      <div class="checkout-steps" aria-label="Étape 2 sur 2"><span class="checkout-step active"></span><span class="checkout-step active"></span></div>
      <form id="checkout-form" class="checkout-card" novalidate>
        <h2 class="h4 mb-4">Coordonnées de livraison</h2>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="customer-name">Nom et prénom *</label><input class="form-control" id="customer-name" name="name" autocomplete="name" required><div class="invalid-feedback"></div></div>
          <div class="col-md-6"><label class="form-label" for="customer-email">Adresse e-mail *</label><input class="form-control" id="customer-email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback"></div></div>
          <div class="col-md-6"><label class="form-label" for="customer-phone">Numéro de téléphone *</label><input class="form-control" id="customer-phone" name="phone" type="tel" autocomplete="tel" placeholder="+216 22 333 444" required><div class="invalid-feedback"></div></div>
          <div class="col-12"><label class="form-label" for="customer-address">Adresse de livraison *</label><input class="form-control" id="customer-address" name="address" autocomplete="street-address" required><div class="invalid-feedback"></div></div>
          <div class="col-md-7"><label class="form-label" for="customer-city">Ville *</label><input class="form-control" id="customer-city" name="city" autocomplete="address-level2" required><div class="invalid-feedback"></div></div>
          <div class="col-md-5"><label class="form-label" for="customer-postal">Code postal *</label><input class="form-control" id="customer-postal" name="postalCode" autocomplete="postal-code" inputmode="numeric" required><div class="invalid-feedback"></div></div>
          <div class="col-12"><label class="form-label" for="customer-instructions">Instructions de livraison</label><textarea class="form-control" id="customer-instructions" name="instructions" rows="3" placeholder="Étage, point de repère, heure préférée…"></textarea></div>
        </div>
        <fieldset class="mt-4"><legend class="h5">Mode de paiement *</legend><div class="form-check border rounded-3 p-3 ps-5"><input class="form-check-input" type="radio" name="paymentMethod" id="payment-cod" value="Paiement à la livraison"><label class="form-check-label fw-semibold" for="payment-cod">Paiement à la livraison</label><div class="text-secondary small">Payez en espèces lors de la réception.</div></div><div class="invalid-feedback d-block" id="payment-error"></div></fieldset>
        <div class="alert alert-danger d-none mt-4" id="checkout-error" role="alert"></div>
        <button class="btn btn-primary btn-lg w-100 mt-4" type="submit" id="submit-order"><span class="button-label">Confirmer la commande</span><span class="spinner-border spinner-border-sm ms-2 d-none" aria-hidden="true"></span></button>
      </form>
    </div><div class="col-lg-4"><aside class="summary-card" id="checkout-summary" aria-label="Résumé de la commande"></aside></div></div></div></section>
  </main>
  <footer id="site-footer"></footer>
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Revenir en haut"><i class="bi bi-arrow-up"></i></button>
  <div id="toast-region" class="toast-container position-fixed top-0 end-0 p-3"></div>
